name: reki_mvp
description: REKI MVP - Venue discovery and crowd intelligence for Manchester
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

  # Auth & secure storage
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # Local persistence (Week 10 - Offline)
  shared_preferences: ^2.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Connectivity (Week 10)
  connectivity_plus: ^6.0.3

  # Location & Maps (Week 8)
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  google_maps_flutter: ^2.9.0

  # Firebase - Crashlytics (Week 7) + FCM (Week 9)
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.0.0

  # Image caching (Week 7 - Performance)
  cached_network_image: ^3.3.1

  # Image picker
  image_picker: ^1.1.2

  # Logging (Week 7)
  logger: ^2.4.0

  # Charts (Business dashboard)
  fl_chart: ^0.68.0

  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  mockito: ^5.4.4
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
